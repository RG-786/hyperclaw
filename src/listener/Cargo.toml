[package]
name = "hyperclaw-listener"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "hc-listener"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc     = "3"

[profile.release]
opt-level = "z"
lto       = true
codegen-units = 1
panic     = "abort"
strip     = true
